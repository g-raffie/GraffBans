# GraffBans mesajları (Türkçe). Biçim: MiniMessage — https://docs.advntr.dev/minimessage/format
# Değişkenler: <target> cezalı oyuncu, <id> ceza numarası, <reason> sebep, <operator> cezayı veren,
# <duration> kalan süre, <scope> sunucu

date-format: "dd.MM.yyyy HH:mm"

ban-screen: |-
  <red><bold>Sunucudan yasaklandın</bold></red>

  <gray>Sebep:</gray> <white><reason></white>
  <gray>Yetkili:</gray> <white><operator></white>
  <gray>Kalan süre:</gray> <white><duration></white>
  <gray>Ceza no:</gray> <white>#<id></white>
  <appeal>

# Kalıcı banlar için ayrı ekran. Boş bırakılırsa ban-screen kullanılır.
ban-screen-permanent: ""

# config.yml appeals.enabled açıkken <appeal> olarak gösterilir (ban ekranı, banned-lobby, muted):
# <appeal_url> panelin itiraz sayfası, <appeal_code> sadece bu oyuncunun gördüğü kod.
appeal-line: "<gray>İtiraz için:</gray> <aqua><appeal_url></aqua> <gray>· kod:</gray> <white><bold><appeal_code></bold></white>"

# Yeni bir GraffBans sürümü çıktı (config.yml update-check); graffbans.notify.update yetkisi olanlara girişte gösterilir.
update-available: "<gold>GraffBans <version> çıktı</gold> <gray>(sende <current> var).</gray> <open><aqua><u>İndir</u></aqua></open> <gray><notes></gray>"

kick-screen: |-
  <red><bold>Sunucudan atıldın</bold></red>

  <gray>Sebep:</gray> <white><reason></white>
  <gray>Yetkili:</gray> <white><operator></white>

# Proxy arkasında: sunucuya özel ban oyuncuyu o sunucuya sokmadığında gösterilir.
banned-from-server: "<red><server> sunucusundan yasaklısın.</red> <gray>Sebep:</gray> <white><reason></white> <gray>· Kalan:</gray> <white><duration></white> <gray>· Ceza no:</gray> <white>#<id></white>"

# Ağ çapında ban var ama oyuncu bu sunucuda kalabiliyor (config.yml login.banned-player-servers):
# oraya geldiğinde ve oyundayken banlandığında gösterilir.
banned-lobby: "<red>Bu ağdan yasaklısın.</red> <gray>Sebep:</gray> <white><reason></white> <gray>· Kalan:</gray> <white><duration></white> <gray>· Ceza no:</gray> <white>#<id></white> <gray>Sadece bu sunucuda kalabilirsin.</gray> <appeal>"

muted: "<red>Susturuldun.</red> <gray>Sebep:</gray> <white><reason></white> <gray>· Kalan:</gray> <white><duration></white> <appeal>"
# Kalıcı susturmalar için. Boşsa muted kullanılır.
muted-permanent: ""

warned: "<yellow>Uyarı aldın:</yellow> <white><reason></white> <gray>(<operator>)</gray>"

offline-warning: "<yellow>Sen yokken uyarı aldın:</yellow> <white><reason></white> <gray>(<operator>)</gray>"

login-database-error: "<red>Ceza kontrolü şu an yapılamıyor. Lütfen biraz sonra tekrar dene.</red>"

broadcast:
  silent-prefix: "<gray>[Sessiz]</gray> "
  ban: "<red><target></red> <gray>kalıcı olarak yasaklandı. Yetkili:</gray> <white><operator></white> <gray>Sebep:</gray> <white><reason></white>"
  tempban: "<red><target></red> <gray><white><duration></white> süreyle yasaklandı. Yetkili:</gray> <white><operator></white> <gray>Sebep:</gray> <white><reason></white>"
  mute: "<gold><target></gold> <gray>kalıcı olarak susturuldu. Yetkili:</gray> <white><operator></white> <gray>Sebep:</gray> <white><reason></white>"
  tempmute: "<gold><target></gold> <gray><white><duration></white> süreyle susturuldu. Yetkili:</gray> <white><operator></white> <gray>Sebep:</gray> <white><reason></white>"
  # IP ban/susturma duyuruları. Boşsa ban / tempban / mute / tempmute kullanılır.
  ipban: ""
  tempipban: ""
  ipmute: ""
  tempipmute: ""
  warn: "<yellow><target></yellow> <gray>uyarıldı. Yetkili:</gray> <white><operator></white> <gray>Sebep:</gray> <white><reason></white>"
  kick: "<yellow><target></yellow> <gray>sunucudan atıldı. Yetkili:</gray> <white><operator></white> <gray>Sebep:</gray> <white><reason></white>"
  unban: "<green><target></green> <gray>yasağı kaldırıldı. Yetkili:</gray> <white><operator></white>"
  unmute: "<green><target></green> <gray>susturması kaldırıldı. Yetkili:</gray> <white><operator></white>"
  unwarn: "<green><target></green> <gray>son uyarısı kaldırıldı. Yetkili:</gray> <white><operator></white>"
  # /graffbans broadcast; <message> yetkilinin yazdığı metin (sadece renk ve biçim).
  custom: "<message>"


punish:
  default-reason: "Sebep belirtilmedi"
  already-ban: "<red><target> zaten yasaklı</red> <gray>(#<id>, <operator>: <reason>, kalan: <duration>)</gray>"
  already-mute: "<red><target> zaten susturulmuş</red> <gray>(#<id>, <operator>: <reason>, kalan: <duration>)</gray>"
  not-ban: "<red><target> yasaklı değil.</red>"
  not-mute: "<red><target> susturulmuş değil.</red>"
  not-warn: "<red><target> oyuncusunun uyarısı yok.</red>"
  template-step: "<gray>Şablon <white><template></white>: <step>/<steps>. basamak</gray>"
  # -m: cezanın değiştirildikten sonraki hali.
  modified: "<green><target> oyuncusunun #<id> cezası değiştirildi:</green> <white><reason></white> <gray>· kalan:</gray> <white><duration></white>"
  # -d
  deleted: "<green><target> oyuncusunun <count> cezası silindi.</green> <gray>Geçmişte de görünmeyecek.</gray>"
  not-own: "<red>Sadece kendi verdiğin cezaları kaldırabilir veya değiştirebilirsin.</red>"
  # Aynı yerde geçerli bir ban/susturma varken yenisi verildiğinde (graffbans.override) eskisine yazılan kaldırma sebebi.
  replaced-reason: "Yeni bir cezayla değiştirildi"
  # config.yml warnings.actions bir oyuncu için çalıştı (uyarıyı verene gösterilir).
  warning-actions: "<gray><target> artık <white><count></white> uyarıya sahip; config.yml'deki uyarı eylemleri çalıştırıldı.</gray>"
  # warnings.clear-after-action oyuncunun uyarılarını kaldırdı.
  warnings-cleared: "<gray><target> oyuncusunun <count> uyarısı silindi.</gray>"
  warnings-cleared-reason: "Uyarı sınırına ulaşıldı"

error:
  no-permission: "<red>Bu komutu kullanma yetkin yok.</red>"
  player-not-found: "<red><input> adında bir oyuncu bu sunucuya hiç girmemiş.</red>"
  not-online: "<red><target> şu an çevrimiçi değil.</red>"
  no-known-ip: "<red><target> için bilinen bir IP yok.</red>"
  exempt: "<red><target> cezalandırılamaz.</red>"
  invalid-duration: "<red>Geçersiz süre: <input></red> <gray>Örnek: 30m, 1.5h, 1d, 1w, 1mo, 1d12h, 5 days</gray>"
  invalid-ip: "<red>Geçersiz IP adresi: <input></red>"
  invalid-server: "<red>Geçersiz sunucu adı: <input></red>"
  console-only: "<red>Bu komutu sadece konsol kullanabilir.</red>"
  unsupported-flag: "<red><input> seçeneği desteklenmiyor ya da değeri geçersiz.</red>"
  flag-not-here: "<red><input> seçeneği bu komutla kullanılamaz.</red>"
  flag-console-only: "<red><input> seçeneğini sadece konsol kullanabilir.</red>"
  internal: "<red>Bir hata oluştu, konsolu kontrol et.</red>"

usage:
  ban: "<red>Kullanım: /ban <oyuncu> [süre|şablon] [sebep] [-s]</red>"
  tempban: "<red>Kullanım: /tempban <oyuncu> <süre|şablon> [sebep] [-s]</red>"
  ipban: "<red>Kullanım: /ipban <oyuncu|ip> [süre|şablon] [sebep] [-s]</red>"
  tempipban: "<red>Kullanım: /tempipban <oyuncu|ip> <süre|şablon> [sebep] [-s]</red>"
  unban: "<red>Kullanım: /unban <oyuncu|ip|ID> [sebep] [-s]</red>"
  mute: "<red>Kullanım: /mute <oyuncu> [süre|şablon] [sebep] [-s]</red>"
  tempmute: "<red>Kullanım: /tempmute <oyuncu> <süre|şablon> [sebep] [-s]</red>"
  ipmute: "<red>Kullanım: /ipmute <oyuncu|ip> [süre|şablon] [sebep] [-s]</red>"
  tempipmute: "<red>Kullanım: /tempipmute <oyuncu|ip> <süre|şablon> [sebep] [-s]</red>"
  unmute: "<red>Kullanım: /unmute <oyuncu|ip|ID> [sebep] [-s]</red>"
  warn: "<red>Kullanım: /warn <oyuncu> [süre] [sebep] [-s]</red>"
  kick: "<red>Kullanım: /kick <oyuncu> [sebep] [-s]</red>"
  history: "<red>Kullanım: /history <oyuncu> [bans|mutes|warnings|kicks] [sayfa]</red>"
  staffhistory: "<red>Kullanım: /staffhistory <yetkili|console> [bans|mutes|warnings|kicks] [sayfa]</red>"
  iphistory: "<red>Kullanım: /iphistory <oyuncu> [sayfa]</red>"
  unwarn: "<red>Kullanım: /unwarn <oyuncu|ID> [sebep] [-s]</red>"
  warnings: "<red>Kullanım: /warnings [oyuncu] [sayfa]</red>"
  dupeip: "<red>Kullanım: /dupeip <oyuncu|ip></red>"
  ipreport: "<red>Kullanım: /ipreport [sayfa]</red>"
  lastuuid: "<red>Kullanım: /lastuuid <oyuncu></red>"
  namehistory: "<red>Kullanım: /namehistory <oyuncu></red>"
  staffrollback: "<red>Kullanım: /staffrollback <yetkili|console> [süre]</red>"
  prunehistory: "<red>Kullanım: /prunehistory <oyuncu> [süre]</red>"
  checkban: "<red>Kullanım: /checkban <oyuncu|ip|ID></red>"
  checkmute: "<red>Kullanım: /checkmute <oyuncu|ip|ID></red>"
  checkwarn: "<red>Kullanım: /checkwarn <oyuncu|ID></red>"
  banlist: "<red>Kullanım: /banlist [sayfa]</red>"
  mutelist: "<red>Kullanım: /mutelist [sayfa]</red>"
  warnlist: "<red>Kullanım: /warnlist [sayfa]</red>"
  lockdown: "<gray>Kullanım: /lockdown <sebep> [server:<ad>] · /lockdown end [server:<ad>]</gray>"
  report: "<red>Kullanım: /report <oyuncu> <sebep></red>"
  reports: "<red>Kullanım: /reports [sayfa] | claim <ID> | resolve <ID> [not] | reject <ID> [not]</red>"
  graffbans: "<red>Kullanım: /graffbans reload | import litebans|h2 [--dry-run] | allow | unlink | broadcast | info | servers | add-login | reset-templates | reset-database</red>"
  graffbans-allow: "<red>Kullanım: /graffbans allow <add|check|remove> <oyuncu></red> <gray>(IP'si başka bir hesapta banlı olsa da girebilir)</gray>"
  graffbans-unlink: "<red>Kullanım: /graffbans unlink <oyuncu></red> <gray>(IP'lerini unutur, /dupeip artık bağlamaz)</gray>"
  graffbans-broadcast: "<red>Kullanım: /graffbans broadcast <mesaj> [broadcast-type:<tür>]</red> <gray>(<red>red</red> ya da &c gibi renkler, yeni satır için \\n)</gray>"
  graffbans-add-login: "<red>Kullanım: /graffbans add-login <isim> <uuid> <ip></red>"
  graffbans-reset-templates: "<red>Kullanım: /graffbans reset-templates [confirm]</red>"
  graffbans-reset-database: "<red>Kullanım: /graffbans reset-database [server:<ad>] [mode:delete|deactivate|prune] [exclude:bans|mutes|warnings|kicks]</red>"
  modify: "<red>Kullanım: /ban -m <oyuncu|ID> [süre] [sebep]</red> <gray>(/mute ve /warn için de)</gray>"


history:
  header: "<gold><target> ceza geçmişi</gold> <gray>(sayfa <page>)</gray>"
  empty: "<gray>Kayıt yok.</gray>"
  line: "<gray>#<id> <date></gray> <white><type></white> <gray><length></gray> <white><reason></white> <gray>· <operator> ·</gray> <status>"

staffhistory:
  header: "<gold><target> tarafından verilen cezalar</gold> <gray>(sayfa <page>)</gray>"
  empty: "<gray>Kayıt yok.</gray>"
  line: "<gray>#<id> <date></gray> <white><type></white> <yellow><target></yellow> <gray><length></gray> <white><reason></white> <gray>·</gray> <status>"

iphistory:
  header: "<gold><target> IP geçmişi</gold> <gray>(sayfa <page>)</gray>"
  empty: "<gray>Kayıt yok.</gray>"
  line: "<white><ip></white> <gray>ilk: <first> · son: <last></gray>"

warnings:
  header: "<gold><target> uyarıları</gold> <gray>(sayfa <page>)</gray>"
  empty: "<gray>Uyarı yok.</gray>"
  line: "<gray>#<id> <date></gray> <white><reason></white> <gray>· <operator></gray>"

# /dupeip: IP'deki tüm hesaplar tek satırda, durumuna göre renkli.
dupeip:
  header: "<gold><ip> adresindeki hesaplar</gold> <gray>(<count>)</gray>"
  empty: "<gray><ip> adresinden giren hesap yok.</gray>"
  online: "<green><name></green>"
  offline: "<gray><name></gray>"
  muted: "<gold><name></gold>"
  banned: "<red><name></red>"
  separator: "<dark_gray>, </dark_gray>"
  legend: "<dark_gray>[<green>çevrimiçi</green> <gray>çevrimdışı</gray> <gold>susturulmuş</gold> <red>yasaklı</red>]</dark_gray>"

# /ipreport: IP'sini başka hesaplarla paylaşan çevrimiçi oyuncular. <accounts> /dupeip gibi renklidir.
ipreport:
  header: "<gold><online> çevrimiçi oyuncudan <count> tanesi IP'sini başka hesaplarla paylaşıyor</gold> <gray>(sayfa <page>)</gray>"
  empty: "<gray>Kayıt yok.</gray>"
  line: "<yellow><player></yellow> <gray>(<count>):</gray> <accounts>"
  more: "<gray> ve <count> hesap daha</gray>"

lastuuid:
  line: "<white><target></white> <gray>UUID'si:</gray> <white><uuid></white>"

# /namehistory: GraffBans kurulduğundan beri (ve LiteBans'tan aktarılan) isimler.
namehistory:
  header: "<gold><target> isim geçmişi</gold>"
  empty: "<gray>Kayıt yok.</gray>"
  line: "<white><name></white> <gray>ilk: <first> · son: <last></gray>"

prunehistory:
  confirm: "<yellow><target> oyuncusunun bitmiş tüm cezaları (kaldırılmış, süresi dolmuş, kickler) kalıcı olarak silinecek.</yellow> <gray>Devam etmek için <seconds> saniye içinde</gray> <white>/prunehistory <input> confirm</white> <gray>yaz.</gray>"
  nothing-to-confirm: "<red>Onaylanacak bir işlem yok.</red> <gray>Önce</gray> <white>/prunehistory <input></white> <gray>yaz.</gray>"
  done: "<green><target> oyuncusunun <count> bitmiş cezası silindi.</green>"

# /graffbans allow, unlink, add-login
allow:
  added: "<green><target> artık IP'si başka bir hesapta banlı olsa da girebilir.</green>"
  already: "<gray><target> zaten izinli.</gray>"
  removed: "<green><target> artık IP banlarını aşamaz.</green>"
  is-allowed: "<green><target>, IP'si başka bir hesapta banlı olsa da girebilir.</green>"
  not-allowed: "<gray><target> IP banlarını aşamaz.</gray>"
unlink:
  done: "<green><target> oyuncusunun <count> IP adresi unutuldu.</green> <gray>Aynı IP'den tekrar girerse yeniden bağlanır.</gray>"
add-login:
  done: "<green><target> girişi kaydedildi.</green>"

# /graffbans info, servers
info:
  header: "<gold>GraffBans</gold>"
  line: "<gray><key>:</gray> <white><value></white>"
  server: Sunucu
  database: Veritabanı
  pool: Bağlantılar
  sync: Sunucular arası senkronizasyon
  templates: Şablonlar
  language: Dil
servers:
  single: "<gray>Sunucular arası senkronizasyon kapalı (H2 veritabanı): bu veritabanını sadece bu sunucu kullanıyor.</gray>"
  header: "<gold>Bu veritabanında <count> GraffBans kurulumu var</gold> <gray>(son 90 saniyede görülen)</gray>"
  proxy: "<white><name></white> <gray>(proxy)</gray>"
  server: "<white><name></white>"

# /graffbans reset-templates, reset-database (sadece konsol)
reset:
  templates-confirm: "<yellow>Önceki cezalar artık hiçbir şablon merdiveninde sayılmayacak (kimsenin banı kalkmaz).</yellow> <gray><seconds> saniye içinde</gray> <white>/graffbans reset-templates confirm</white> <gray>yaz.</gray>"
  templates-done: "<green><count> ceza artık şablon merdivenlerinde sayılmıyor.</green>"
  database-confirm: "<red>Bu işlem tüm <types> cezalarına <mode> uygulayacak (<scope>).</red> <gray>Devam etmek için <seconds> saniye içinde</gray> <white><command></white> <gray>yaz.</gray>"
  database-done: "<green>Veritabanı sıfırlandı (<mode>, <scope>): <count> ceza.</green>"
  nothing-to-confirm: "<red>Onaylanacak bir işlem yok ya da komut farklı.</red>"
  # mode:deactivate kaldırma sebebi olarak yazar.
  removed-reason: "Veritabanı sıfırlandı"

staffrollback:
  done: "<green><target> tarafından verilen <count> ceza kaldırıldı.</green>"
  none: "<gray><target> tarafından verilmiş, geri alınacak aktif ceza yok.</gray>"
  # Süre yazılmadığında (yetkilinin verdiği her şey) sorulur.
  confirm: "<yellow><target> tarafından verilen ve hâlâ süren <count> cezanın hepsi kaldırılacak.</yellow> <gray>Devam etmek için <seconds> saniye içinde</gray> <white>/staffrollback <input> confirm</white> <gray>yaz.</gray>"
  nothing-to-confirm: "<red>Onaylanacak bir işlem yok.</red> <gray>Önce</gray> <white>/staffrollback <input></white> <gray>yaz.</gray>"
  # Geri alınan her cezaya kaldırma sebebi olarak yazılır.
  removed-reason: "Yetkili cezaları geri alındı"

security:
  # Shown to players instead of an IP address when security.hide-ips is on.
  hidden-ip: "[IP gizli]"

type:
  ban: Ban
  mute: Mute
  warn: Uyarı
  kick: Kick

status:
  active: "<red>aktif</red>"
  expired: "<gray>süresi doldu</gray>"
  removed: "<green>kaldırıldı</green>"
  kick: ""

scope:
  global: tüm sunucular

duration:
  permanent: Kalıcı
  day: "<n>g"
  hour: "<n>sa"
  minute: "<n>dk"
  second: "<n>sn"

# /graffbans import litebans
import:
  started: "<gray>LiteBans'tan aktarma başladı. Büyük veritabanlarında birkaç dakika sürebilir; bitince mesaj gelecek.</gray>"
  started-dry-run: "<gray>Deneme çalıştırması: LiteBans verisi okunuyor, hiçbir şey yazılmayacak.</gray>"
  connected: "<gray><white><source></white> bağlantısı kuruldu.</gray>"
  # <step>: players, bans, mutes, warnings veya kicks.
  progress: "<gray><white><count></white> satır okundu: <step>.</gray>"
  done: "<green>LiteBans aktarımı tamamlandı.</green>"
  done-dry-run: "<yellow>Deneme bitti, hiçbir şey yazılmadı. --dry-run olmadan şunlar eklenecek:</yellow>"
  summary-players: "<gray>Oyuncu:</gray> <white><players></white> <gray>· IP adresi:</gray> <white><ips></white>"
  summary-type: "<gray><type>:</gray> <white><imported></white> <gray>yeni, <already> zaten aktarılmış</gray>"
  skipped-wildcard: "<yellow><count> joker IP banı atlandı: adresi okunamadı (GraffBans 192.168.1.* gibi biçimleri alır).</yellow>"
  skipped-invalid: "<yellow>Geçerli oyuncu UUID'si veya IP'si olmayan <count> satır atlandı.</yellow>"
  after: "<gray>Tekrar çalıştırmak güvenli: sadece yeni kayıtlar eklenir. Aktarılan susturmalar bu sunucuda hemen, diğerlerinde oyuncu tekrar girince; banlar bir sonraki girişte geçerli olur.</gray>"
  templates:
    added: "<green>templates.yml'e <count> LiteBans şablonu eklendi:</green> <white><names></white> <gray>(eski dosya templates.yml.before-litebans-import olarak duruyor)</gray>"
    would-add: "<yellow>templates.yml'e <count> LiteBans şablonu eklenecek:</yellow> <white><names></white>"
    already-exists: "<gray><white><template></white> şablonu templates.yml'de zaten var; olduğu gibi bırakıldı.</gray>"
    unsupported-type: "<yellow><white><template></white> şablonu atlandı: GraffBans'ta henüz <detail> yok.</yellow>"
    bad-name: "<yellow><white><template></white> şablonu atlandı: adlar sadece a-z, 0-9, _ ve - içerebilir.</yellow>"
    bad-duration: "<yellow><white><template></white> şablonu atlandı: okunamayan süre <detail>.</yellow>"
    # Şablona özel ban ekranı, actions, flags veya permission; ban ekranını mesaj dosyasında ayarla.
    left-out-options: "<yellow><white><template></white> şablonu şunlar olmadan çevrildi:</yellow> <white><detail></white> <gray>(GraffBans'ta bunlar yok; ban ekranı mesaj dosyasındaki ban-screen)</gray>"
  # /graffbans import h2: GraffBans'ın kendi H2 dosyası (database.mv.db), artık kullandığı MySQL/MariaDB'ye.
  h2:
    started: "<gray>GraffBans'ın H2 dosyası yeni veritabanına kopyalanıyor. Bitince mesaj gelecek.</gray>"
    started-dry-run: "<gray>Deneme çalıştırması: GraffBans'ın H2 dosyası okunuyor, hiçbir şey yazılmayacak.</gray>"
    done: "<green>H2 aktarımı tamamlandı. Kopyalananlar:</green>"
    done-dry-run: "<yellow>Deneme bitti, hiçbir şey yazılmadı. --dry-run olmadan kopyalanacaklar:</yellow>"
    table: "<gray><table>:</gray> <white><count></white>"
    after: "<gray>Ceza numaraları aynı kaldı. Yeni veritabanında zaten olan oyuncu, IP ve isim kayıtları korundu. H2 dosyası yerinde duruyor; her şey doğru görünüyorsa silebilirsin.</gray>"
  error:
    already-running: "<red>Zaten bir aktarma çalışıyor.</red>"
    h2-own-same: "<red>GraffBans hâlâ kendi H2 dosyasını kullanıyor.</red> <gray>config.yml'de database.type'ı mysql veya mariadb yap, yeniden başlat, sonra /graffbans import h2 yaz.</gray>"
