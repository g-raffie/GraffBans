# GraffBans configuration
# /graffbans reload applies most changes; server-name, database and compatibility need a restart.

# Name of this server. Used for server-scoped punishments ("server:skyblock") and shown in history.
# On a Velocity network, install GraffBans on the proxy and on every backend, all with the same
# mysql/mariadb database below. Each backend's name must be exactly its name in velocity.toml
# (e.g. survival, anarchy), so "/ban x server:survival" matches. On the proxy, use e.g. "proxy".
server-name: survival

# Language of the messages: tr or en. The file messages_<language>.yml in this folder is used.
language: en

database:
  # h2      = local file in this folder, no setup needed. Good for a single server.
  # mysql / mariadb = shared database. Required when several servers share punishments; then
  #                   punishments reach every server within about 2 seconds (cross-server sync).
  type: h2

  # Only used for mysql / mariadb.
  host: localhost
  port: 3306
  database: graffbans
  username: root
  password: ""

  # Prefix for all GraffBans tables. Change it only before the first start.
  table-prefix: gb_

  # Maximum database connections.
  pool-size: 10

mutes:
  # Muted players cannot use these commands either, so a mute cannot be dodged with private messages.
  # An entry also blocks everything after it: "/msg" blocks "/msg Bob hi"; "/mail send" blocks
  # "/mail send ..." but not "/mail read". Add your own plugins' chat commands, or use [] to block none.
  command-blacklist:
    - /me
    - /say
    - /tell
    - /whisper
    - /reply
    - /pm
    - /message
    - /msg
    - /emsg
    - /epm
    - /etell
    - /ewhisper
    - /w
    - /m
    - /t
    - /r
    - /mail send
  # true = also block the same commands with a plugin prefix, e.g. "/minecraft:me" or "/essentials:msg".
  prevent-bypass: true

warnings:
  # How long a warning given without a duration counts, e.g. 30d. "permanent" = until it is removed.
  # "/warn Bob 7d spam" and "/warn Bob duration:permanent spam" still set their own.
  expire-after: permanent
  # Commands run when a warning brings a player to a number of warnings in effect (the new one included):
  #   '<count>:<command>'   exactly that many,   '<count>+:<command>'   that many or more.
  # Filled in: $player (name), $playerUUID, $reason (of this warning), $list (reasons of all warnings in
  # effect), $count, $id, $executor, $silent (true/false; "-s:$silent" keeps a silent warning's action silent).
  # A command starting with "console:" is always run by the console. Template actions run after these.
  # Example (remove the # to use it):
  # actions:
  #   - '3:/kick -s:$silent $player Final warning: $reason'
  #   - '4+:/tempban -s:$silent $player 1d Reached $count warnings: $list'
  actions: []
  # true = the console runs the actions; false = whoever gave the warning does (with their permissions).
  actions-as-console: false
  # true = after an action ran, the player's warnings in effect are removed, so counting starts again.
  clear-after-action: false

security:
  # true = only the console sees IP addresses. Players can still use /dupeip (they see the accounts),
  # and a ban on a bare IP is announced without the address. Protects player IPs if an operator
  # account is ever taken over.
  hide-ips: true
  # true = only the console can use /iphistory.
  iphistory-console-only: true

login:
  # If the database cannot be reached when a player joins:
  # true  = let them in (a banned player may slip through while the database is down)
  # false = keep everyone out until the database is back
  allow-on-database-error: true
  # Servers that players with a network-wide ban may still join, e.g. a lobby where they can read why they
  # are banned (and, later, appeal). Use the same list on the proxy and on every backend.
  # Behind a Velocity proxy: names from velocity.toml. A banned player joining the network is sent to the
  #   first of these and cannot switch to any other server; banned while online, they are moved there.
  # On a server without a proxy: put this server's own server-name here to let banned players in.
  # A ban only for that server (server:lobby) still keeps them out. [] = banned players cannot join at all.
  banned-player-servers: []

import:
  # Where the LiteBans plugin folder is, for /graffbans import litebans. Empty = the "LiteBans" folder
  # next to GraffBans' own (plugins/LiteBans; on Velocity plugins/litebans). Relative to the server folder.
  # GraffBans reads LiteBans' config.yml there to find its data (H2 file or MySQL/MariaDB), so usually
  # nothing needs to be set. LiteBans does not need to be installed or running; better if it is not.
  litebans-folder: ""

compatibility:
  # true = LiteBans permission nodes work too: someone with litebans.ban may use /ban, litebans.admin
  # may use /graffbans import and reload, and so on. Lets a server switch from LiteBans without
  # changing its permission setup. ".own" nodes map too: litebans.unban.own grants graffbans.unban.own
  # (only punishments you issued). Changing this needs a restart.
  litebans-permissions: true

limits:
  # Staff groups: limits per rank. (A LiteBans durations.limits section can also be pasted here as it is.)
  # A staff member is in every group whose permission they have; "none" = everyone.
  # tempban / tempmute: the longest temporary ban / mute. The highest of their groups applies.
  #   Permanent punishments are not limited here: they need the /ban or /mute permission.
  #   Templates are not limited either; use require-template to allow only templates.
  # cooldown-ban / -mute / -warn / -kick: time between two punishments of that kind, both for the
  #   staff member and for the target. The lowest of their groups applies; 5s if a group sets none.
  # cooldown-redo: how soon after an /unban or /unmute the same player may be banned or muted again
  #   The lowest of their groups applies; 1s if a group sets none.
  # graffbans.group.unlimited skips duration limits and require-template; graffbans.cooldown.bypass
  # (or .ban / .mute / .warn / .kick) skips cooldowns. Operators have both. Use "groups: {}" for no limits.
  groups:
    moderator:
      permission: graffbans.group.moderator
      tempban: 30d
      tempmute: 30d
    helper:
      permission: graffbans.group.helper
      tempban: 15d
      tempmute: 7d
    other:
      permission: none
      tempban: 7d
      tempmute: 1d
      cooldown-ban: 20s
      cooldown-kick: 20s
      cooldown-mute: 20s
      cooldown-warn: 20s
      require-template: false
  # true = a longer duration is cut to the limit; false = it is refused.
  reduce-to-limit: true
  # Protects players from being punished twice by the console within this time.
  console-cooldown: 1s

notify:
  # Staff notices. On a network they reach every server.
  # A banned player tried to join. Seen with graffbans.notify.banned-join.
  banned-join: true
  # A muted player tried to chat or use a blocked command. Seen with graffbans.notify.muted-chat.
  muted-chat: true
  # A player joined from the same IP as a banned account. Seen with graffbans.notify.alts;
  # players with graffbans.exempt.alts never trigger it.
  alts-on-join: true
  # The same player triggers the same notice at most once per this time.
  throttle: 10m

# Check twice a day whether a newer GraffBans is out, and tell the console and staff with
# graffbans.notify.update when they join. Only a small public file on GitHub is downloaded; nothing about
# your server is sent.
update-check: true

appeals:
  # Show where and how to appeal on ban screens and mute messages (the <appeal> placeholder in the messages
  # file): the panel's address (web.base-url) and the punishment's code. Turn it on on EVERY server once
  # the panel runs somewhere and web.base-url is the address players can open.
  enabled: false
  # What can be appealed: ban, mute
  types: [ban, mute]
  # After a denied appeal, the same punishment can be appealed again after this long.
  retry-after: 7d
  # Appeals one address may send per hour.
  per-hour: 3

reports:
  # /report <player> <reason>: players report rule breakers. Staff with graffbans.notify.report see each
  # report on every server; /reports and the panel list them. Punishing the reported player closes their
  # open reports. Players need graffbans.report (everyone has it unless you take it away).
  enabled: true
  # A player may send one report per this time.
  cooldown: 1m

discord:
  # A Discord channel webhook that gets appeal notices: new appeal, the player's replies, the decision.
  # In Discord: channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL. Empty = off.
  # Only the server that runs the panel sends them.
  appeals-webhook: ""
  # A webhook for player reports (/report): who reported whom, why, and on which server. Empty = off.
  # The server that handles /report sends it (on a network: the proxy).
  reports-webhook: ""
  # A weekly staff report in a Discord channel: what each staff member did in the 7 days before (punishments,
  # removals, appeal decisions, closed reports, punishments overturned on appeal). Empty = off. Sent by the server
  # that runs the panel, once a week on this day and time (server time zone); the panel shows it any time.
  staff-report-webhook: ""
  staff-report-day: monday
  staff-report-time: "09:00"

web:
  # The built-in web panel (staff accounts, appeals). Turn it on on ONE server only: on a network the
  # proxy, otherwise the server itself. All servers share the database, so the panel sees everything.
  enabled: false
  # 127.0.0.1 = only reachable from this machine; put Nginx, Caddy or a Cloudflare Tunnel in front for
  # HTTPS (recommended). 0.0.0.0 = reachable from outside directly (plain HTTP; the panel warns about it).
  bind: 127.0.0.1
  port: 8150
  # The address players and staff open, used in setup and appeal links, e.g. https://panel.example.com
  base-url: "http://localhost:8150"
  # true only behind a reverse proxy on this machine: then the panel trusts its X-Forwarded-For /
  # X-Forwarded-Proto headers for the visitor's IP and HTTPS.
  trust-proxy-headers: false
  # A login lasts this long, and ends earlier after this much inactivity.
  session-length: 12h
  idle-timeout: 1h
  # Panel roles. Staff get one with /graffbans web register (in game: their highest
  # graffbans.web.<role> permission; from the console: given in the command).
  # rank: higher may manage lower. limits-group: the config.yml limits group their panel punishments follow.
  # require-2fa: members must turn on two-step login (an authenticator app) before they can use the panel.
  # Abilities: view, punish, punish.template-only, unpunish, modify, delete, appeals.reply, appeals.decide,
  #            see-ips, audit, users, reports (claim and close player reports; viewing them needs only view),
  #            staff-report (what each staff member did)
  roles:
    owner:
      rank: 100
      require-2fa: true
      abilities: [view, punish, unpunish, modify, delete, appeals.reply, appeals.decide, reports, see-ips, audit, staff-report, users]
    admin:
      rank: 75
      require-2fa: true
      abilities: [view, punish, unpunish, modify, delete, appeals.reply, appeals.decide, reports, see-ips, audit, staff-report]
    moderator:
      rank: 50
      limits-group: moderator
      abilities: [view, punish, unpunish, modify, appeals.reply, appeals.decide, reports]
    helper:
      rank: 25
      limits-group: helper
      abilities: [view, punish.template-only, appeals.reply, reports]
  # A public ban list at <base-url>/bans (also mutes, warnings, kicks and a player search), like a LiteBans web
  # page. IP addresses and silent (-s) punishments are never shown. Appeals work whether this is on or not.
  public-pages: false
  # Sites that may show the public pages (ban list, appeal form) inside an iframe on their own pages, e.g.
  # ["https://myserver.com"]. Staff pages can never be put in an iframe. [] = no site may.
  embed-allowed-sites: []
  # How the panel looks. /graffbans reload applies it.
  theme:
    # Shown in the header and page titles. Empty = "GraffBans Panel".
    server-name: ""
    # An https:// image address, or the name of an image file you put in plugins/GraffBans/web/ (e.g. logo.png).
    logo: ""
    # Main colour of buttons and links.
    accent-color: "#e5484d"
    # auto (follows the visitor's system), dark or light.
    mode: auto
    # Extra styling: put a custom.css file in plugins/GraffBans/web/; it is loaded after the panel's own.
